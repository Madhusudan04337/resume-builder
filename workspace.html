    { key: "codechef", label: "CodeChef", icon: "CC", placeholder: "codechef.com/users/...", isLink: true, prefix: "https://" }
  ];
  var ICON_COLORS = {
    phone: { bg: "#EEF2FF", col: "#4338CA" }, email: { bg: "#FFF7ED", col: "#C2410C" },
    linkedin: { bg: "#EFF6FF", col: "#1D4ED8" }, github: { bg: "#F9FAFB", col: "#374151" },
    portfolio: { bg: "#F0FDF4", col: "#15803D" }, leetcode: { bg: "#FEF9C3", col: "#A16207" },
    gfg: { bg: "#F0FDF4", col: "#16A34A" }, twitter: { bg: "#F0F9FF", col: "#0369A1" },
    hackerrank: { bg: "#F0FDF4", col: "#15803D" }, codechef: { bg: "#FFF7ED", col: "#C2410C" }
  };
  var S = {
    personal: { firstName: "", lastName: "", address: "", phone: "", email: "", linkedin: "", github: "", portfolio: "", leetcode: "", gfg: "", twitter: "", hackerrank: "", codechef: "", summary: "", photo: "" },
    headline: "",
    socialEnabled: { phone: true, email: true, linkedin: true, github: true, portfolio: false, leetcode: false, gfg: false, twitter: false, hackerrank: false, codechef: false, summary: true },
    template: "classic",
    accentColor: "#32166f",
    education: [], coursework: [], experience: [], projects: [],
    skills: [
      { category: "Programming Languages", list: "" },
      { category: "Developer Tools", list: "" },
      { category: "Technologies / Frameworks", list: "" }
    ],
    spokenLanguages: "",
    leadership: [], certifications: [],
    references: "",
    sectionOrder: ["Education", "Coursework", "Experience", "Projects", "Skills", "Languages", "Certifications", "Leadership", "References"],
    activeView: "ai",
    fileName: "my_resume",
    atsScore: null,
    atsFeedback: "",
    customSections: []
  };
  var TABS = ["Personal", "Education", "Coursework", "Experience", "Projects", "Skills", "Languages", "Leadership", "Certifications", "References", "Custom"];
  
  var TAB_ICONS = {
    Personal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    Education: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>',
    Coursework: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9 12l2 2 4-4"/></svg>',
    Experience: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    Projects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
    Skills: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    Languages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>',
    Leadership: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    Certifications: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 11 2 2 4-4"/></svg>',
    References: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    Custom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>'
  };

  var activeTab = "Personal";
  var aiParserInputCache = ""; // Retain text pasted inside parser between view shifts
  var currentLoadedDraftId = null; // Track which draft is actively loaded
  
  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  
  function linkify(text) {
    if (!text) return "";
    var urlRegex = /(((https?:\/\/)|(www\.))[^\s]+)/g;
    return text.replace(urlRegex, function(url) {
      var href = url.startsWith("http") ? url : "https://" + url;
      return '<a href="' + href + '" target="_blank" rel="noopener" style="color:#1a0dab;text-decoration:underline">' + url + '</a>';
    });
  }
  
  var DEFS = {
    education: { university: "", degree: "", start: "", end: "", loc: "" },
    experience: { company: "", role: "", start: "", end: "", loc: "", bullets: [] },
    projects: { name: "", tech: "", date: "", github: "", demo: "", bullets: [] },
    leadership: { org: "", role: "", start: "", end: "", loc: "", bullets: [] },
    certifications: { name: "", url: "", provider: "", start: "", end: "", skills: "" },
    skills: { category: "", list: "" }
  };
  
  function getApiUrl(path) {
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      if (window.location.port !== '5000') {
        return 'http://localhost:5000' + path;
      }
      return path;
    }
    if (window.location.protocol === 'file:') {
      return 'http://localhost:5000' + path;
    }
    // Deployed production environment: route '/api/parse-resume' to '/.netlify/functions/parse-resume'
    return '/.netlify/functions' + path.replace('/api', '');
  }
  
  async function parseResumeWithAI(text) {
    const response = await fetch(getApiUrl('/api/parse-resume'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    });
    if (!response.ok) {
      let errMsg = "Backend server error";
      try {
        const errorData = await response.json();
        if (errorData && errorData.message) {
          errMsg = errorData.message;
        }
      } catch (e) {}
      throw new Error(errMsg);
    }
    return await response.json();
  }
  
  function applyParsed(p) {
    if (p.personal) { 
      Object.keys(p.personal).forEach(function (k) { 
        if (k in S.personal && p.personal[k]) S.personal[k] = p.personal[k]; 
      }); 
      SOCIAL_DEFS.forEach(function (sd) { 
        if (S.personal[sd.key]) S.socialEnabled[sd.key] = true; 
      }); 
    }
    if (p.headline) S.headline = p.headline;
    if (Array.isArray(p.education) && p.education.length) S.education = p.education;
    if (Array.isArray(p.coursework) && p.coursework.length) S.coursework = p.coursework;
    if (Array.isArray(p.experience) && p.experience.length) S.experience = p.experience;
    if (Array.isArray(p.projects) && p.projects.length) S.projects = p.projects;
    if (p.skills) {
      if (Array.isArray(p.skills)) {
        S.skills = JSON.parse(JSON.stringify(p.skills));
      } else {
        S.skills = [];
        if (p.skills.languages) S.skills.push({ category: "Programming Languages", list: p.skills.languages });
        if (p.skills.tools) S.skills.push({ category: "Developer Tools", list: p.skills.tools });
        if (p.skills.tech) S.skills.push({ category: "Technologies / Frameworks", list: p.skills.tech });
      }
    }
    if (p.spokenLanguages) S.spokenLanguages = p.spokenLanguages;
    if (Array.isArray(p.leadership) && p.leadership.length) S.leadership = p.leadership;
    if (Array.isArray(p.certifications) && p.certifications.length) S.certifications = p.certifications;
    if (Array.isArray(p.customSections) && p.customSections.length) {
      if (!S.customSections) S.customSections = [];
      p.customSections.forEach(function(cs, idx) {
        if (cs.heading && cs.content) {
          var headingLower = cs.heading.toLowerCase();
          if (headingLower.includes('achievement') || headingLower.includes('extracurricular') || headingLower.includes('award') || headingLower.includes('honor') || headingLower.includes('co-curricular') || headingLower.includes('leadership')) {
            if (!S.leadership) S.leadership = [];
            var lines = cs.content.split('\n').map(function(line) {
              return line.trim().replace(/^[-*•]\s*/, '');
            }).filter(Boolean);
            
            S.leadership.push({
              org: cs.heading,
              role: "",
              start: "",
              end: "",
              loc: "",
              bullets: lines
            });
          } else {
            var newId = 'custom_' + Date.now() + '_' + idx;
            S.customSections.push({

    // Sync active activity tab and drawer item styling
    document.querySelectorAll('.activity-tab, .drawer-item').forEach(function(t) {
      if (t.dataset.view === view) t.classList.add('active');
      else t.classList.remove('active');
    });

    // Remove any existing clear button from header
    var existingClear = document.getElementById('clearResumeBtn');
    if (existingClear) existingClear.remove();
    var existingPreview = document.getElementById('sidebarPreviewBtn');
    if (existingPreview) existingPreview.remove();

    if (view === "editor") {

  function renderResume() { 
    var rp = document.getElementById('rp');
    if (!rp) return;
    
    // Render content
    rp.innerHTML = resumeHTML();
    
    // Measure exact height of 1 A4 page in pixels dynamically
    var dummy = document.createElement('div');
    dummy.style.height = '297mm';
    dummy.style.visibility = 'hidden';
    dummy.style.position = 'absolute';
    document.body.appendChild(dummy);
    var a4HeightPx = dummy.offsetHeight;
    document.body.removeChild(dummy);
    
    // Remove existing spacers and gaps
    var existingSpacers = rp.querySelectorAll('.page-break-spacer');
    existingSpacers.forEach(function(el) { el.remove(); });
    
    // Reset height to auto to let content expand naturally
    rp.style.height = 'auto';
    
    // 10mm padding equivalent in pixels
    var marginPx = a4HeightPx * (10 / 297);
    var gapHeight = 20; // 20px visual gap
    
    // Measure absolute positions of all block elements
    var rpRect = rp.getBoundingClientRect();
    var rpTop = rpRect.top + window.scrollY;
    
    // Process page breaks up to 5 pages
    var maxPages = 5;
    for (var pageNum = 1; pageNum < maxPages; pageNum++) {
      var boundaryY = pageNum * a4HeightPx;
      var bottomMarginY = boundaryY - marginPx;
      var topMarginY = boundaryY + marginPx;
      
      // Query block elements that can be pushed (to prevent overlaps and preserve column/flex flows)
      var selector = '.rsh, .rent, .rcrs, .rcert, div[style*="margin-bottom"], .sinp, .srow, .rc';
      if (S.template === 'executive' || S.template === 'elizabeth') {
        selector = '.r-main-col .rsh, .r-main-col .rent, .r-main-col .rcrs, .r-main-col .rcert, .r-main-col div[style*="margin-bottom"], .r-main-col .sinp, .r-main-col .srow, .r-main-col .rc';
      }
      var blocks = rp.querySelectorAll(selector);
      var targetElement = null;
      
      for (var i = 0; i < blocks.length; i++) {
        var el = blocks[i];
        
        // Skip elements that are inside/under an already created spacer
        if (el.closest('.page-break-spacer')) continue;
        
        var rect = el.getBoundingClientRect();
        var elTop = rect.top + window.scrollY - rpTop;
        var elBottom = elTop + rect.height;
        
        // If element starts after bottomMarginY, or crosses it
        if (elTop > bottomMarginY - 5) {
          targetElement = el;
          break;
        } else if (elBottom > bottomMarginY) {
          targetElement = el;
          break;
        }
      }
      
      if (targetElement) {
        var elRect = targetElement.getBoundingClientRect();
        var elTop = elRect.top + window.scrollY - rpTop;
        
        var spacerHeight = topMarginY - elTop;
        if (spacerHeight > 0) {
          var spacer = document.createElement('div');
          spacer.className = 'page-break-spacer';
          spacer.style.height = spacerHeight + 'px';
          
          var gap = document.createElement('div');
          gap.className = 'page-break-gap';
          
          // Position the 20px gap exactly centered at boundaryY relative to spacer top
          var gapTop = (boundaryY - elTop) - (gapHeight / 2);
          gap.style.top = gapTop + 'px';
          gap.style.height = gapHeight + 'px';
          
          var label = document.createElement('span');
          label.className = 'page-break-label';
          label.textContent = 'Page ' + (pageNum + 1);
          gap.appendChild(label);
          
          spacer.appendChild(gap);
          targetElement.parentNode.insertBefore(spacer, targetElement);
        }
      } else {
        break;
      }
    }
    
    // Calculate final content height after spacer insertion
    var contentHeight = rp.scrollHeight;
    var numPages = Math.ceil(contentHeight / a4HeightPx);
    if (numPages < 1) numPages = 1;
    
    // Lock the container height to exact multiples of A4
    rp.style.height = (numPages * a4HeightPx) + 'px';
    
    updateWorkspaceDiagnostics();
  }

  function updateWorkspaceDiagnostics() {

    // 2. Count preview words

    var words = rpText.trim().split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCountLabel').textContent = words + ' words';
    
    // 3. Update Status footer values
    document.getElementById('statusTemplate').innerHTML = 'Template: <strong>' + S.template.charAt(0).toUpperCase() + S.template.slice(1) + '</strong>';
    document.getElementById('statusAccent').innerHTML = 'Accent: <strong style="color:' + S.accentColor + '">' + S.accentColor + '</strong>';
    
    var activeSectionsCount = S.sectionOrder.filter(function(name) {
      if (name === "Education" && S.education.length) return true;
      if (name === "Coursework" && S.coursework.length) return true;
      if (name === "Experience" && S.experience.length) return true;
      if (name === "Projects" && S.projects.length) return true;
      if (name === "Skills" && (Array.isArray(S.skills) ? S.skills.some(s => s.category && s.list) : (S.skills.languages || S.skills.tools || S.skills.tech))) return true;
      if (name === "Languages" && S.spokenLanguages) return true;
      if (name === "Certifications" && S.certifications.length) return true;
      if (name === "Leadership" && S.leadership.length) return true;
      if (name === "References" && S.references) return true;
      if (name.startsWith("custom_")) {
        var cs = (S.customSections || []).find(function(c) { return c.id === name; });
        return !!(cs && cs.heading && cs.content);
      }
      return false;
    }).length;
    
    document.getElementById('statusSections').innerHTML = 'Sections: <strong>' + activeSectionsCount + '</strong>';
  }

  function saveNewDraft() {
    var input = document.getElementById('draftNameInput');
    if (!input) return;
    var name = input.value.trim();
    if (!name) {
      name = "Draft_" + new Date().toISOString().slice(0, 10) + "_" + new Date().toTimeString().slice(0,5).replace(':', '');
    }
    
    var drafts = JSON.parse(localStorage.getItem('mdk_resume_drafts') || '[]');
    var newId = "dr_" + Date.now();
    var newDraft = {
      id: newId,
      name: name,
      timestamp: Date.now(),
      data: JSON.parse(JSON.stringify(S))
    };
    drafts.push(newDraft);
    localStorage.setItem('mdk_resume_drafts', JSON.stringify(drafts));
    
    currentLoadedDraftId = newId;
    renderPrimarySidebar(); // re-renders to show Overwrite button
  }

  function overwriteDraft() {
    if (!currentLoadedDraftId) return;
    var input = document.getElementById('draftNameInput');
    var name = input ? input.value.trim() : "";
    
    var drafts = JSON.parse(localStorage.getItem('mdk_resume_drafts') || '[]');
    var index = drafts.findIndex(function(d) { return d.id === currentLoadedDraftId; });
    
    if (index !== -1) {
      if (name) drafts[index].name = name;
      drafts[index].timestamp = Date.now();
      drafts[index].data = JSON.parse(JSON.stringify(S));
      localStorage.setItem('mdk_resume_drafts', JSON.stringify(drafts));
      
      var btn = document.getElementById('overwriteDraftBtn');
      if (btn) {
        var old = btn.innerHTML;
        btn.innerHTML = "Saved ✓";
        setTimeout(function() { btn.innerHTML = old; }, 1500);
      }
      renderDraftsList();
    }
  }

  function loadDraft(id) {
    currentLoadedDraftId = id;
    var drafts = JSON.parse(localStorage.getItem('mdk_resume_drafts') || '[]');
    var found = drafts.find(function(d) { return d.id === id; });
    if (!found) return;
    
    Object.keys(found.data).forEach(function(k) { S[k] = found.data[k]; });

    if (S.sectionOrder && !S.sectionOrder.includes("Languages")) S.sectionOrder.push("Languages");
    if (S.spokenLanguages === undefined) S.spokenLanguages = "";
    if (S.fileName === undefined) S.fileName = found.name.replace(/[^a-zA-Z0-9_\-]/g, '_');
    if (S.skills && !Array.isArray(S.skills)) {
      S.skills = [
        { category: "Programming Languages", list: S.skills.languages || "" },
        { category: "Developer Tools", list: S.skills.tools || "" },
        { category: "Technologies / Frameworks", list: S.skills.tech || "" }
      ];
    }
    if (S.customSections === undefined) {
      S.customSections = [];
    }
    
    document.getElementById('docTitle').textContent = S.fileName;
    
    renderPrimarySidebar();
    renderResume();
    saveToLocal();
  }

    localStorage.setItem('mdk_resume_drafts', JSON.stringify(drafts));

    if (togBtn) {
      var k = togBtn.dataset.tog;
      S.socialEnabled[k] = !S.socialEnabled[k];
      renderForm();
      renderResume();
      return;
    }
    
    var addBtn = e.target.closest('[data-add]');
    if (addBtn) {
      var key = addBtn.dataset.add;
      S[key].push(JSON.parse(JSON.stringify(DEFS[key])));
      renderForm();
      renderResume();
      return;
    }
    
    if (e.target.id === 'addCustomSectionBtn') {
      if (!S.customSections) S.customSections = [];
      var newId = 'custom_' + Date.now();
      S.customSections.push({ id: newId, heading: "Custom Section", content: "" });
      if (!S.sectionOrder.includes(newId)) {
        S.sectionOrder.push(newId);
      }
      renderForm();
      renderResume();
      return;
    }
    
    var rmBtn = e.target.closest('[data-rm]');
    if (rmBtn) {
      var key = rmBtn.dataset.rm, idx = +rmBtn.dataset.idx;
      if (key === 'custom') {
        var removed = S.customSections.splice(idx, 1)[0];
        if (removed && removed.id) {
          S.sectionOrder = S.sectionOrder.filter(function(name) { return name !== removed.id; });
        }
      } else {
        S[key].splice(idx, 1);
      }
      renderForm();
      renderResume();
      return;
    }
    
    if (e.target.id === "aiBtn") {
      var txt = document.getElementById('importTa').value.trim();
      var aiStatus = document.getElementById('aiStatus');
      if (!txt) { aiStatus.innerHTML = '<span class="ai-err">Please paste plain text first.</span>'; return; }
      
      e.target.disabled = true;
      aiStatus.innerHTML = '<span class="spin"></span> Gemini parsing data...';
      
      try {
        var parsed = await parseResumeWithAI(txt);
        applyParsed(parsed);
        aiParserInputCache = "";
        
        S.activeView = "editor";
        renderPrimarySidebar();
        renderResume();
      } catch (err) {
        aiStatus.innerHTML = '<span class="ai-err">' + esc(err.message) + '</span>';
      } finally {
        e.target.disabled = false;
      }
      return;
    }
    
    if (e.target.id === "clrBtn") {
      document.getElementById('importTa').value = '';
      aiParserInputCache = "";
      document.getElementById('aiStatus').innerHTML = '';
      return;
    }
    
    if (e.target.id === "scoreBtn") {
      var scoreBtn = e.target;
      var resDiv = document.getElementById('scoreResult');
      scoreBtn.disabled = true;
      scoreBtn.innerHTML = '<span class="spin"></span> Analyzing...';
      
      try {
        const response = await fetch(getApiUrl('/api/score-resume'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume: JSON.stringify(S) })
        });
        if (!response.ok) {
          let errMsg = "Audit failed. Make sure backend is running.";
          try {
            const errorData = await response.json();
            if (errorData && errorData.message) {
              errMsg = errorData.message;
            }
          } catch (e) {}
          throw new Error(errMsg);
        }
        const data = await response.json();
        
        S.atsScore = data.score;
        S.atsFeedback = data.feedback;
        
        renderPrimarySidebar();
      } catch (err) {
        resDiv.innerHTML = '<div class="ai-err" style="margin-top:10px;text-align:center;font-size:11px;line-height:1.4">' + esc(err.message) + '</div>';
      } finally {
        scoreBtn.disabled = false;
        scoreBtn.innerHTML = '📊 Audit & Score Resume';
      }
      return;
    }
    
    var accentDot = e.target.closest('.accent-dot');
    if (accentDot) {
      document.querySelectorAll('.accent-dot').forEach(d => d.classList.remove('active'));
      accentDot.classList.add('active');
      S.accentColor = accentDot.dataset.color;
      renderResume();
      return;
    }
    
    var tmplCard = e.target.closest('.template-card');
    if (tmplCard) {
      document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
      tmplCard.classList.add('active');
      S.template = tmplCard.dataset.template;
      if (S.template === 'sabrina') {
        S.accentColor = '#c8986b';
        saveToLocal();
      } else if (S.template === 'elizabeth') {
        S.accentColor = '#2d3748';
        saveToLocal();
      }
      renderResume();
      return;
    }

    if (e.target.closest('#aiPolishSummaryShortcutBtn') || e.target.id === 'aiPolishBtn') {
      var skillsArr = [];
      if (Array.isArray(S.skills)) {
        S.skills.forEach(function(s) {
          if (s.list) skillsArr.push(s.list);
        });
      } else {
        if (S.skills.languages) skillsArr.push(S.skills.languages);
        if (S.skills.tools) skillsArr.push(S.skills.tools);
        if (S.skills.tech) skillsArr.push(S.skills.tech);
      }
      if (S.spokenLanguages) skillsArr.push(S.spokenLanguages);
      const skills = skillsArr.filter(Boolean).join(', ');
      const experience = S.experience.map(e => e.role + " at " + e.company + " (" + e.bullets.join('; ') + ")").join(' | ');

      if (!skills && !experience) {
        alert("Please enter some skills or work experience details first so Gemini can construct a summary!");
        return;
      }
      
      var btn = e.target.closest('#aiPolishSummaryShortcutBtn') || e.target;
      var original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Building summary...';
      
      try {
        const response = await fetch(getApiUrl('/api/generate-summary'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ skills, experience })
        });
        if (!response.ok) {
          let errMsg = "Backend server error";
          try {
            const errorData = await response.json();
            if (errorData && errorData.message) {
              errMsg = errorData.message;
            }
          } catch (e) {}
          throw new Error(errMsg);
        }
        const data = await response.json();
        
        S.personal.summary = data.summary;
        var summaryField = document.getElementById('summary-field');
        if (summaryField) summaryField.value = data.summary;
        renderResume();
        
        if (btn.id === 'aiPolishSummaryShortcutBtn') {
          alert("Gemini updated your resume summary successfully! Check details inside the Document Editor.");
        }
      } catch (err) {
        alert("Summary Generation Failed:\n\n" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
      return;
    }

    if (e.target.id === "saveDraftBtn") {
      saveNewDraft();
      return;
    }
    if (e.target.id === "overwriteDraftBtn") {
      overwriteDraft();
      return;
    }

    var loadBtn = e.target.closest('.load-draft-btn');
    if (loadBtn) {
      loadDraft(loadBtn.dataset.id);
      return;
    }

    var deleteBtn = e.target.closest('.delete-draft-btn');
    if (deleteBtn) {
      deleteDraft(deleteBtn.dataset.id);
      return;
    }

    if (e.target.id === "exportBtn") {
      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
      var dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", S.fileName + "_backup.json");
      dlAnchor.click();
      return;
    }

    if (e.target.id === "importBtn") {
      document.getElementById('fileInput').click();
      return;
    }
  });

  // 3. Primary Sidebar Input Sync Event Delegation
  sidebarContent.addEventListener('input', function (e) {
    var t = e.target, p = t.dataset.p; 
    if (!p) return;
    
    if (p === 'coursework') { 
      S.coursework = t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); 
      renderResume(); 
      return; 
    }
    if (p === 'headline') { 
      S.headline = t.value; 
      renderResume(); 
      return; 
    }
    
    var keys = p.split('.'); 
    var cur = S;
    for (var i = 0; i < keys.length - 1; i++) { 
      cur = cur[isNaN(keys[i]) ? keys[i] : +keys[i]]; 
    }
    
    var last = keys[keys.length - 1];
    if (last === 'bullets') {
      cur[last] = t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    } else {
      cur[last] = t.value;
    }
    renderResume();
  });

  sidebarContent.addEventListener('change', function(e) {
    if (e.target.id === 'fileInput') {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var p = JSON.parse(ev.target.result);
          Object.keys(p).forEach(function (k) { S[k] = p[k]; });
          
          if (S.skills && !Array.isArray(S.skills)) {
            S.skills = [
              { category: "Programming Languages", list: S.skills.languages || "" },
              { category: "Developer Tools", list: S.skills.tools || "" },
              { category: "Technologies / Frameworks", list: S.skills.tech || "" }
            ];
          }
          if (S.customSections === undefined) {
            S.customSections = [];
          }
          
          document.getElementById('docTitle').textContent = S.fileName || "my_resume";
          renderPrimarySidebar();
          renderResume();
          alert("JSON backup loaded successfully!");
        } catch (err) {
          alert("Invalid JSON file formatting.");
        }
      };
      reader.readAsText(file);
    }
    else if (e.target.id === 'photoUpload') {
      var file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert("Please upload a valid image file (PNG, JPG, JPEG, WebP).");
        return;
      }
      if (file.size > 1.2 * 1024 * 1024) {
        alert("Image size should be less than 1.2MB for optimal performance.");
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev) {
        S.personal.photo = ev.target.result;
        renderPrimarySidebar();
        renderResume();
      };
      reader.readAsDataURL(file);
    }
  });

  // 4. Drag & Drop Reordering for Editor Entries (Section Order only)
  var dragIdx = null;
  sidebarContent.addEventListener('dragstart', function(e) {
    var item = e.target.closest('#orderList [draggable]');
    if (!item) return;
    dragIdx = +item.dataset.idx;
    e.dataTransfer.effectAllowed = 'move';
  });
  sidebarContent.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  sidebarContent.addEventListener('drop', function(e) {
    e.preventDefault();
    var item = e.target.closest('#orderList [draggable]');
    if (!item || dragIdx === null) return;
    var dropIdx = +item.dataset.idx;
    if (dragIdx !== dropIdx) {
      var moving = S.sectionOrder.splice(dragIdx, 1)[0];
      S.sectionOrder.splice(dropIdx, 0, moving);
      renderForm(); 
      renderResume();
      saveToLocal();
    }
    dragIdx = null;
  });

  /* ----------------------------------
     Document Title Inline Editor
  ---------------------------------- */

  document.getElementById('titleContainer').addEventListener('dblclick', function(e) {
    if (document.getElementById('titleInput')) return;
    
    var current = S.fileName || "my_resume";
    var container = this;
    container.innerHTML = `<input type="text" id="titleInput" value="${current}" style="font-size:12px; font-weight:700; color:var(--text-primary); background:var(--bg-input); border:1px solid var(--border-focus); border-radius:6px; padding:2px 6px; width:160px; outline:none; height:22px">`;
    
    var input = document.getElementById('titleInput');
    input.focus();
    input.select();
    
    function saveTitle() {
      var val = input.value.trim().replace(/[^a-zA-Z0-9_\-]/g, '_');
      if (!val) val = "my_resume";
      S.fileName = val;
      container.innerHTML = `<span class="document-title-text" id="docTitle">${val}</span><span class="document-title-ext">.pdf</span><span class="document-edit-icon">✏️</span>`;
      saveToLocal();
    }
    
    input.addEventListener('keydown', function(evt) {
      if (evt.key === 'Enter') saveTitle();
      if (evt.key === 'Escape') {
        container.innerHTML = `<span class="document-title-text" id="docTitle">${S.fileName}</span><span class="document-title-ext">.pdf</span><span class="document-edit-icon">✏️</span>`;
      }
    });
    
    input.addEventListener('blur', saveTitle);
  });

  /* ----------------------------------
     Print PDF Download Override
  ---------------------------------- */

  document.getElementById('dlbtn').addEventListener('click', function () { 
    var originalTitle = document.title;
    document.title = S.fileName || "my_resume";
    window.print(); 
    document.title = originalTitle; 
  });

  /* ----------------------------------
     Zooming Canvas Controls
  ---------------------------------- */

  var zoomLevel = 1.0;
  var zoomLabel = document.getElementById('zoomLabel');
  
  function updateZoom(level) {
    if (window.innerWidth <= 1024) {
      zoomLevel = 1.0;
    } else {
      zoomLevel = Math.max(0.5, Math.min(1.5, level));
    }
    zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
    document.documentElement.style.setProperty('--resume-scale', zoomLevel);
  }
  
  document.getElementById('zoomOutBtn').addEventListener('click', function() {
    updateZoom(zoomLevel - 0.1);
  });
  
  document.getElementById('zoomInBtn').addEventListener('click', function() {
    updateZoom(zoomLevel + 0.1);
  });
  
  document.getElementById('zoomFitBtn').addEventListener('click', function() {
    var wrapper = document.querySelector('.pp');
    var fitScale = (wrapper.clientWidth - 40) / 800;
    updateZoom(Math.min(1.0, fitScale));
  });

  /* ----------------------------------
     Mobile Fullscreen Preview Overlay Controls
  ---------------------------------- */
  var activityPreviewBtn = document.getElementById('activityPreviewBtn');
  var mobilePreviewOverlay = document.getElementById('mobilePreviewOverlay');
  var overlayCloseBtn = document.getElementById('overlayCloseBtn');
  var overlayDlBtn = document.getElementById('overlayDlBtn');
  var overlayRp = document.getElementById('overlayRp');
  var overlayZoomContainer = document.getElementById('overlayZoomContainer');

  function updateOverlayScale() {
    if (mobilePreviewOverlay && mobilePreviewOverlay.style.display === 'block') {
      var availableWidth = window.innerWidth - 40;
      var a4WidthPx = 794; // 210mm at 96 DPI
      var scale = availableWidth / a4WidthPx;
      overlayZoomContainer.style.transform = 'scale(' + Math.min(1.0, scale) + ')';
    }
  }

  if (overlayCloseBtn) {
    overlayCloseBtn.addEventListener('click', function() {
      mobilePreviewOverlay.style.display = 'none';
      document.body.style.overflow = ''; // restore background scroll
    });
  }

  if (overlayDlBtn) {
    overlayDlBtn.addEventListener('click', function() {
      var originalTitle = document.title;
      document.title = S.fileName || "my_resume";
      window.print();
      document.title = originalTitle;
    });
  }

  let lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    const currentWidth = window.innerWidth;
    updateOverlayScale();
    if (currentWidth <= 1024) {
      updateZoom(1.0);
    }

    // Only re-render sidebar if the width changed (e.g. orientation change or desktop resize)
    // Mobile keyboard only changes height, so we skip re-render to keep input focus.
    if (currentWidth !== lastWidth) {
      if (typeof renderPrimarySidebar === 'function') {
        renderPrimarySidebar();
      }
      lastWidth = currentWidth;
    }
  });



  /* ----------------------------------
     Local Workspace Persistence (localStorage)
  ---------------------------------- */

  var syncTimeout = null;

  function saveToLocal() { 
    localStorage.setItem('resume_data', JSON.stringify(S)); 
  }
  
  function loadFromLocal() {
    var saved = localStorage.getItem('resume_data');
    if (saved) {
      try {
        var p = JSON.parse(saved);
        Object.keys(p).forEach(function (k) { S[k] = p[k]; });
        
        // Add migrations
        if (S.sectionOrder && !S.sectionOrder.includes("Languages")) {
          S.sectionOrder.push("Languages");
        }
        if (S.sectionOrder && !S.sectionOrder.includes("References")) {
          S.sectionOrder.push("References");
        }
        if (S.references === undefined) {
          S.references = "";
        }
        if (S.spokenLanguages === undefined) {
          S.spokenLanguages = "";
        }
        if (S.activeView === undefined) {
          S.activeView = "ai";
        }
        if (S.fileName === undefined) {
          S.fileName = "my_resume";
        }
        if (S.skills && !Array.isArray(S.skills)) {
          S.skills = [
            { category: "Programming Languages", list: S.skills.languages || "" },
            { category: "Developer Tools", list: S.skills.tools || "" },
            { category: "Technologies / Frameworks", list: S.skills.tech || "" }
          ];
        }
        if (S.customSections === undefined) {
          S.customSections = [];
        }
        
        // Sync document title in header
        document.getElementById('docTitle').textContent = S.fileName;
        
      } catch (e) { console.error("Workspace load failed", e); }
    }
  }

  // Auto-save hooking into render triggers
  var originalRenderForm = renderForm;
  renderForm = function() { originalRenderForm(); saveToLocal(); }
  var originalRenderResume = renderResume;
  renderResume = function() { originalRenderResume(); saveToLocal(); }

  /* ----------------------------------
     Initialization
  ---------------------------------- */

  loadFromLocal();

  S.activeView = "ai"; // Always open AI Co-pilot first on page load
  renderPrimarySidebar();
  renderResume();

</script>
<script type="module" src="auth-ui.js"></script>
</body>
</html>
