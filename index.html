<script>
  var SOCIAL_DEFS = [
    { key: "phone", label: "Phone", icon: "☎", placeholder: "Your phone number", isLink: false },
    { key: "email", label: "Email", icon: "@", placeholder: "you@gmail.com", isLink: true, prefix: "mailto:" },
    { key: "linkedin", label: "LinkedIn", icon: "in", placeholder: "linkedin.com/in/user", isLink: true, prefix: "https://" },
    { key: "github", label: "GitHub", icon: "GH", placeholder: "github.com/username", isLink: true, prefix: "https://" },
    { key: "portfolio", label: "Portfolio", icon: "⬡", placeholder: "yourportfolio.com", isLink: true, prefix: "https://" },
    { key: "leetcode", label: "LeetCode", icon: "LC", placeholder: "leetcode.com/u/username", isLink: true, prefix: "https://" },
    { key: "gfg", label: "GeeksforGeeks", icon: "GG", placeholder: "geeksforgeeks.org/user/...", isLink: true, prefix: "https://" },
    { key: "twitter", label: "Twitter / X", icon: "X", placeholder: "twitter.com/username", isLink: true, prefix: "https://" },
    { key: "hackerrank", label: "HackerRank", icon: "HR", placeholder: "hackerrank.com/profile/...", isLink: true, prefix: "https://" },
    { key: "codechef", label: "CodeChef", icon: "CC", placeholder: "codechef.com/users/...", isLink: true, prefix: "https://" }
  ];
  var ICON_COLORS = {
    phone: { bg: "#EEF2FF", col: "#4338CA" }, email: { bg: "#FFF7ED", col: "#C2410C" },
    linkedin: { bg: "#EFF6FF", col: "#1D4ED8" }, github: { bg: "#F9FAFB", col: "#374151" },
    portfolio: { bg: "#F0FDF4", col: "#15803D" }, leetcode: { bg: "#FEF9C3", col: "#A16207" },
    gfg: { bg: "#F0FDF4", col: "#16A34A" }, twitter: { bg: "#F0F9FF", col: "#0369A1" },
    hackerrank: { bg: "#F0FDF4", col: "#15803D" }, codechef: { bg: "#FFF7ED", col: "#C2410C" }
  };
  var S = {
    personal: { firstName: "", lastName: "", address: "", phone: "", email: "", linkedin: "", github: "", portfolio: "", leetcode: "", gfg: "", twitter: "", hackerrank: "", codechef: "" },
    headline: "",
    socialEnabled: { phone: true, email: true, linkedin: true, github: true, portfolio: false, leetcode: false, gfg: false, twitter: false, hackerrank: false, codechef: false },
    education: [], coursework: [], experience: [], projects: [],
    skills: { languages: "", tools: "", tech: "" },
    leadership: [], certifications: []
  };
  var TABS = ["Personal", "Education", "Coursework", "Experience", "Projects", "Skills", "Leadership", "Certifications"];
  var activeTab = "Personal";
  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  var DEFS = {
    education: { university: "", degree: "", start: "", end: "", loc: "" },
    experience: { company: "", role: "", start: "", end: "", loc: "", bullets: [] },
    projects: { name: "", tech: "", date: "", bullets: [] },
    leadership: { org: "", role: "", start: "", end: "", loc: "", bullets: [] },
    certifications: { name: "", url: "", provider: "", start: "", end: "", skills: "" }
  };
  async function parseResumeWithAI(text) {
    var prompt = 'You are a resume parser. Extract all information and return ONLY raw JSON with this structure:\n{"personal":{"firstName":"","lastName":"","address":"","phone":"","email":"","linkedin":"","github":"","portfolio":"","leetcode":"","gfg":"","twitter":"","hackerrank":"","codechef":""},"headline":"","education":[{"university":"","degree":"","start":"","end":"","loc":""}],"coursework":[],"experience":[{"company":"","role":"","start":"","end":"","loc":"","bullets":[]}],"projects":[{"name":"","tech":"","date":"","bullets":[]}],"skills":{"languages":"","tools":"","tech":""},"leadership":[{"org":"","role":"","start":"","end":"","loc":"","bullets":[]}],"certifications":[{"name":"","url":"","provider":"","start":"","end":"","skills":""}]}\nResume:\n"""\n' + text + '\n"""';
    var resp = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 3000, messages: [{ role: "user", content: prompt }] }) });
    if (!resp.ok) throw new Error("API error " + resp.status);
    var data = await resp.json();
    var raw = data.content.map(function (b) { return b.text || ""; }).join("").replace(/```json|```/g, "").trim();
    return JSON.parse(raw);
  }
  function applyParsed(p) {
    if (p.personal) { Object.keys(p.personal).forEach(function (k) { if (k in S.personal && p.personal[k]) S.personal[k] = p.personal[k]; }); SOCIAL_DEFS.forEach(function (sd) { if (S.personal[sd.key]) S.socialEnabled[sd.key] = true; }); }
