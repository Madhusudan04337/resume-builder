<script>
  var SOCIAL_DEFS = [
    { key: "phone", label: "Phone", icon: "☎", placeholder: "Your phone number", isLink: false },
    { key: "email", label: "Email", icon: "@", placeholder: "you@gmail.com", isLink: true, prefix: "mailto:" },
    { key: "linkedin", label: "LinkedIn", icon: "in", placeholder: "linkedin.com/in/user", isLink: true, prefix: "https://" },
    { key: "github", label: "GitHub", icon: "GH", placeholder: "github.com/username", isLink: true, prefix: "https://" },
    { key: "portfolio", label: "Portfolio", icon: "⬡", placeholder: "yourportfolio.com", isLink: true, prefix: "https://" },
    { key: "leetcode", label: "LeetCode", icon: "LC", placeholder: "leetcode.com/u/username", isLink: true, prefix: "https://" },
    { key: "gfg", label: "GeeksforGeeks", icon: "GG", placeholder: "geeksforgeeks.org/user/...", isLink: true, prefix: "https://" },
    { key: "twitter", label: "Twitter / X", icon: "X", placeholder: "twitter.com/username", isLink: true, prefix: "https://" },
    { key: "hackerrank", label: "HackerRank", icon: "HR", placeholder: "hackerrank.com/profile/...", isLink: true, prefix: "https://" },
    { key: "codechef", label: "CodeChef", icon: "CC", placeholder: "codechef.com/users/...", isLink: true, prefix: "https://" }
  ];
  var ICON_COLORS = {
    phone: { bg: "#EEF2FF", col: "#4338CA" }, email: { bg: "#FFF7ED", col: "#C2410C" },
    linkedin: { bg: "#EFF6FF", col: "#1D4ED8" }, github: { bg: "#F9FAFB", col: "#374151" },
    portfolio: { bg: "#F0FDF4", col: "#15803D" }, leetcode: { bg: "#FEF9C3", col: "#A16207" },
    gfg: { bg: "#F0FDF4", col: "#16A34A" }, twitter: { bg: "#F0F9FF", col: "#0369A1" },
    hackerrank: { bg: "#F0FDF4", col: "#15803D" }, codechef: { bg: "#FFF7ED", col: "#C2410C" }
  };
  var S = {
    personal: { firstName: "", lastName: "", address: "", phone: "", email: "", linkedin: "", github: "", portfolio: "", leetcode: "", gfg: "", twitter: "", hackerrank: "", codechef: "", summary: "" },
    headline: "",
    socialEnabled: { phone: true, email: true, linkedin: true, github: true, portfolio: false, leetcode: false, gfg: false, twitter: false, hackerrank: false, codechef: false, summary: true },
    template: "classic",
    education: [], coursework: [], experience: [], projects: [],
    skills: { languages: "", tools: "", tech: "" },
    leadership: [], certifications: [],
    sectionOrder: ["Education", "Coursework", "Experience", "Projects", "Skills", "Languages", "Certifications", "Leadership"]
  };
  var TABS = ["Personal", "Education", "Coursework", "Experience", "Projects", "Skills", "Languages", "Leadership", "Certifications"];
  var activeTab = "Personal";
  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function linkify(text) {
    if (!text) return "";
    var urlRegex = /(((https?:\/\/)|(www\.))[^\s]+)/g;
    return text.replace(urlRegex, function(url) {
      var href = url.startsWith("http") ? url : "https://" + url;
      return '<a href="' + href + '" target="_blank" rel="noopener" style="color:#1a0dab;text-decoration:underline">' + url + '</a>';
    });
  }
  var DEFS = {
    education: { university: "", degree: "", start: "", end: "", loc: "" },
    experience: { company: "", role: "", start: "", end: "", loc: "", bullets: [] },
    projects: { name: "", tech: "", date: "", github: "", demo: "", bullets: [] },
    leadership: { org: "", role: "", start: "", end: "", loc: "", bullets: [] },
    certifications: { name: "", url: "", provider: "", start: "", end: "", skills: "" }
  };
  async function parseResumeWithAI(text) {
    const response = await fetch('http://localhost:5000/api/parse-resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    });

    if (!response.ok) throw new Error("Backend server error");
    return await response.json();
  }
  function applyParsed(p) {
    if (p.personal) { Object.keys(p.personal).forEach(function (k) { if (k in S.personal && p.personal[k]) S.personal[k] = p.personal[k]; }); SOCIAL_DEFS.forEach(function (sd) { if (S.personal[sd.key]) S.socialEnabled[sd.key] = true; }); }
    if (p.headline) S.headline = p.headline;
    if (Array.isArray(p.education) && p.education.length) S.education = p.education;

    var t = e.target, p = t.dataset.p; if (!p) return;
    if (p === 'coursework') { S.coursework = t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); renderResume(); return; }
    if (p === 'headline') { S.headline = t.value; renderResume(); return; }
    var keys = p.split('.'); var cur = S;
    for (var i = 0; i < keys.length - 1; i++) { cur = cur[isNaN(keys[i]) ? keys[i] : +keys[i]]; }
    var last = keys[keys.length - 1];
    if (last === 'bullets') cur[last] = t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    else cur[last] = t.value;
    renderResume();
  });
  async function getAISummary() {
    const skills = [S.skills.languages, S.skills.tools, S.skills.tech].filter(Boolean).join(', ');
    const experience = S.experience.map(e => e.role + " at " + e.company + " (" + e.bullets.join('; ') + ")").join(' | ');

    if (!skills && !experience) {
      alert("Please fill in some skills or experience first so AI can generate a summary!");
      return;
    }

    const btn = document.getElementById('aiPolishBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" style="width:10px;height:10px"></span> Polishing...';

    try {
      const response = await fetch('http://localhost:5000/api/generate-summary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ skills, experience })
      });

      if (!response.ok) throw new Error("Backend server error");
      const data = await response.json();
      
      S.personal.summary = data.summary;
      const field = document.getElementById('summary-field');
      if (field) field.value = data.summary;
      renderResume();
    } catch (error) {
      console.error(error);
      alert("Failed to generate summary. Make sure the backend server is running on port 5000.");
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }

  document.getElementById('fc').addEventListener('click', function (e) {
    if (e.target.id === 'aiPolishBtn') {
      getAISummary();
    }
  });

  async function scoreResume() {
    const btn = document.getElementById('scoreBtn');
    const resDiv = document.getElementById('scoreResult');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Analyzing...';
    resDiv.innerHTML = '';

    try {
      const response = await fetch('http://localhost:5000/api/score-resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resume: JSON.stringify(S) })
      });
      if (!response.ok) throw new Error("Backend error");
      const data = await response.json();
      resDiv.innerHTML = '<div style="background:#F0FDF4;border:1px solid #BBF7D0;padding:10px;border-radius:8px;font-size:12px">' +
        '<div style="font-weight:700;color:#166534;margin-bottom:4px">ATS Score: ' + data.score + '/100</div>' +
        '<div style="color:#15803D">' + data.feedback + '</div></div>';
    } catch (e) {
      resDiv.innerHTML = '<div class="ai-err">Failed to score resume. Is server running?</div>';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '📊 Score My Resume (ATS Check)';
    }
  }

  document.getElementById('fc').addEventListener('click', function(e) {
    if (e.target.id === 'scoreBtn') scoreResume();
  });

  // Drag and Drop Logic
  var dragIdx = null;
  document.getElementById('fc').addEventListener('dragstart', function(e) {
    var item = e.target.closest('[draggable]');
    if (!item) return;
    dragIdx = +item.dataset.idx;
    e.dataTransfer.effectAllowed = 'move';
  });
  document.getElementById('fc').addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  document.getElementById('fc').addEventListener('drop', function(e) {
    e.preventDefault();
    var item = e.target.closest('[draggable]');
    if (!item || dragIdx === null) return;
    var dropIdx = +item.dataset.idx;
    if (dragIdx !== dropIdx) {
      var moving = S.sectionOrder.splice(dragIdx, 1)[0];
      S.sectionOrder.splice(dropIdx, 0, moving);
      renderForm(); renderResume();
    }
    dragIdx = null;
  });

  function saveToLocal() { localStorage.setItem('resume_data', JSON.stringify(S)); }
  function loadFromLocal() {
    var saved = localStorage.getItem('resume_data');
    if (saved) {
      try {
        var p = JSON.parse(saved);
        Object.keys(p).forEach(function (k) { S[k] = p[k]; });
        // Migration for new sections
        if (S.sectionOrder && !S.sectionOrder.includes("Languages")) {
          S.sectionOrder.push("Languages");
        }
        renderTabs(); renderForm(); renderResume();
      } catch (e) { console.error("Load failed", e); }
    }
  }

  document.getElementById('dlbtn').addEventListener('click', function () { window.print(); });
  
  // Initialize
  loadFromLocal();
  renderTabs(); renderForm(); renderResume();

  // Watch for changes to save
  var originalRenderForm = renderForm;
  renderForm = function() { originalRenderForm(); saveToLocal(); }
  var originalRenderResume = renderResume;
  renderResume = function() { originalRenderResume(); saveToLocal(); }

</script>
